<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="FR Sportwagen – die aufgerufene Seite wurde nicht gefunden.">
  <title>Seite nicht gefunden – FR Sportwagen</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root {
      --black: #0a0a0a;
      --gray-line: #c4c4c4;
      --gray-text: #767676;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .ico {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
    }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--white);
      background: linear-gradient(160deg, #0a0a0a 0%, #1c1c1c 55%, #0a0a0a 100%);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .dialog {
      width: min(560px, 100%);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 3rem 2.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: translateY(24px);
      animation: dialog-in 0.7s ease 0.1s forwards;
    }
    @keyframes dialog-in {
      to { opacity: 1; transform: none; }
    }
    .dialog .logo { display: block; margin: 0 auto 2rem; width: 150px; fill: var(--white); }
    .dialog .code {
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #8a8a8a;
      margin-bottom: 0.9rem;
    }
    .dialog h1 {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 600;
      line-height: 1.25;
    }
    .dialog p {
      color: #c9c9c9;
      margin-top: 1rem;
    }
    .countdown {
      margin-top: 1.6rem;
      font-size: 0.88rem;
      color: #8a8a8a;
    }
    .actions {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      background: var(--white);
      color: var(--black);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.8rem 2rem;
      border-radius: 4px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .btn.ghost {
      background: transparent;
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }
    .btn.ghost:hover { background: rgba(255, 255, 255, 0.08); }

    @media (max-width: 480px) {
      .dialog { padding: 2.2rem 1.5rem 2rem; }
      .actions .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="dialog" role="alertdialog" aria-labelledby="fehler-titel">
    <svg class="logo" viewBox="130 390 825 300" role="img" aria-label="FR Sportwagen"><path d="M899.35,401.75h-266.23l-.12.21h-334.1l-159.52,276.3h107.72l42.85-74.21h192.86l46.65-80.79h-192.86l19.47-33.72h226.38l-108.84,188.52h107.72l38.93-67.43h96.21l13.08,67.43h114.71l-15.49-77.5c22.96-8.43,44.91-21.17,65.42-37.83,20.83-16.86,37.3-35.77,49.29-56.53,33.82-57.15,13.16-105.05-44.14-104.43ZM835.56,506.19c-3.68,6.37-9.15,11.92-16.6,16.65-7.13,4.52-13.99,6.78-20.57,6.78h-131.37l27.18-47.08h131.37c13.16,0,17.59,10.48,9.99,23.64Z"/></svg>

    <p class="code">Fehler 404</p>
    <h1 id="fehler-titel">Die aufgerufene Seite hat kein Ergebnis erzielt.</h1>
    <p>Die Adresse existiert nicht oder wurde verschoben. Ich leite Sie zur Startseite weiter.</p>
    <p class="countdown">Weiterleitung in <span id="sekunden">8</span> Sekunden</p>

    <div class="actions">
      <a class="btn" href="index.html">Zur Startseite</a>
      <a class="btn ghost" href="fahrzeuge.html">Fahrzeuge ansehen</a>
    </div>
  </div>

  <script src="assets/i18n.js?v=2"></script>
  <script>
    (function () {
      var rest = 8;
      var feld = document.getElementById('sekunden');
      var timer = setInterval(function () {
        rest -= 1;
        if (rest <= 0) {
          clearInterval(timer);
          window.location.replace('index.html');
          return;
        }
        feld.textContent = rest;
      }, 1000);

      /* Wer selbst klickt oder scrollt, wird nicht weitergeleitet */
      ['click', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
        document.addEventListener(ev, function () {
          clearInterval(timer);
          var hinweis = document.querySelector('.countdown');
          if (hinweis) hinweis.style.display = 'none';
        }, { once: true });
      });
    })();
  </script>
</body>
</html>
